domain:
  name: "gdelt_political_risk"
  entity_label: "country_iso3"
  time_col: "timestamp"
  frequency: "1W"                     # Weekly temporal aggregation ('1W' or '1M')
  time_unit_label: "weeks"

forecasting:
  target_indicator: "material_conflict_count" # Target indicator ('material_conflict_count', 'goldstein_score_mean', 'avg_tone_mean')
  target_transform: "log_return"         # Options: 'log_return', 'absolute_change', 'raw_level'
  horizons: [4, 26, 52]                  # 1 Month (4w), 6 Months (26w), 12 Months (52w)

retrieval:
  lookback_window: 12                    # Historical timesteps in state vector
  distance_metric: "rank_euclidean"        # Distance metric for FAISS index
  min_overlap_ratio: 0.70                # Minimum non-null indicator overlap

models:
  quantiles: [0.05, 0.10, 0.50, 0.90, 0.95]
  cv_folds: 5
  cv_window_type: "expanding"
