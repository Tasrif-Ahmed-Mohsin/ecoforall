# Central Configuration for Environment & Climate Risk Dynamic-Horizon Engine

domain:
  name: "environment_climate_risk"
  entity_label: "iso3"
  time_col: "year"
  frequency: "1Y"
  time_unit_label: "years"

forecasting:
  target_indicators:
    - "co2_emissions_per_capita"
    - "temp_anomaly_celsius"
    - "forest_area_pct_land"
    - "floods_count"
    - "droughts_count"
    - "wildfires_count"
    - "extreme_temp_count"
    - "storms_count"
    - "disaster_economic_damage_usd"
    - "renewable_energy_pct_share"
    - "greenhouse_gas_total_kt"
    - "energy_use_per_capita"
    - "protected_area_pct"
  forecasting_mode: "all_targets"
  target_transform: "log_return"
  horizons: [1, 3, 5, 10] # Dynamic forecast horizons in years

retrieval:
  lookback_window: 10 # 10-year lookback window in state vector
  distance_metric: "rank_euclidean"
  min_overlap_ratio: 0.70
  top_k: 8

models:
  quantiles: [0.05, 0.10, 0.50, 0.90, 0.95]
  cv_folds: 5
  cv_window_type: "expanding"
  alpha_conformal: 0.10 # 90% target coverage
