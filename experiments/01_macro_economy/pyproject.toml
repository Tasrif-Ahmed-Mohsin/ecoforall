[project]
name = "country-forecaster"
version = "0.0.1"
description = "Retrieval-augmented forecaster for country economic scenarios"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "pycountry>=23.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["."]