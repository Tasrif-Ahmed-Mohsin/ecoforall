[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-cross-domain-forecasting"
version = "2.0.0"
description = "Adversarial Multi-Horizon Macroeconomic Forecasting with Principled Dynamic Model Selection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Research Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14.0",
    "linearmodels>=6.0",
    "arch>=7.0",
    "statsforecast>=1.7.0",
    "pyarrow>=14.0.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "faiss-cpu>=1.7.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

